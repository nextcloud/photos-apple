name: NextcloudPhotos
options:
  bundleIdPrefix: com.nextcloud
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
    visionOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  PhotosKit:
    path: Packages/PhotosKit
targets:
  NextcloudPhotos:
    type: application
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: App/Shared
      - path: App/Resources
    dependencies:
      - package: PhotosKit
        product: PhotosAppUI
      - package: PhotosKit
        product: PhotosCore
      # Neither extension point exists on visionOS: an app that embeds them does not install there.
      - target: ShareExtension
        embed: true
        destinationFilters: [iOS, macOS]
      - target: NotificationService
        embed: true
        destinationFilters: [iOS, macOS]
      - target: Widgets
        embed: true
      # PhotoKit's background uploads (SPEC §7.18.6); not on visionOS.
      - target: BackgroundUpload
        embed: true
        destinationFilters: [iOS, macOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID)
        PRODUCT_NAME: Nextcloud Photos
        TARGETED_DEVICE_FAMILY: "1,2,7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Nextcloud Photos
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_RESOURCE_ACCESS_PHOTO_LIBRARY: YES
        # Entitlements: always in Release, in Debug only with PHOTOS_DEBUG_ENTITLEMENTS = YES (Config/Base.xcconfig).
        PHOTOS_ENTITLEMENTS_NO: ""
        PHOTOS_ENTITLEMENTS_YES: App/NextcloudPhotos.entitlements
        # macOS spells the push entitlement differently (com.apple.developer.aps-environment).
        "PHOTOS_ENTITLEMENTS_YES[sdk=macosx*]": App/NextcloudPhotos-macOS.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_$(PHOTOS_DEBUG_ENTITLEMENTS))
        Release:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_YES)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only encryption that is exempt: HTTPS, the keychain, and standard algorithms of the system (RSA, SHA-2) for
        # push notifications and checksums. Reasoning: docs/PRIVACY-AND-EXPORT.md.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.photography
        UILaunchScreen: {}
        UIApplicationSupportsMultipleScenes: true
        # Where the system looks for it: without it Vision Pro refuses to open the immersive spaces (memory room, panorama)
        # and iPadOS gives the app a single window.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        NSPhotoLibraryUsageDescription: Nextcloud Photos backs up your photos and videos to your Nextcloud when you turn on backup.
        NSPhotoLibraryAddUsageDescription: Nextcloud Photos saves photos and videos from your Nextcloud to your photo library when you ask it to.
        NSCameraUsageDescription: Nextcloud Photos uses the camera to scan a login QR code.
        # iPhone and iPad: a song of the Music library as the music of memory slideshows (SPEC ME-4), only when the user
        # picks one.
        NSAppleMusicUsageDescription: Nextcloud Photos plays the song you choose from your music library during memory slideshows.
        # One text for every platform: Info.plist values cannot vary by device (a string catalog's device variations end
        # up in InfoPlist.stringsdict, which the system does not read for Info.plist keys), and the Mac must not say
        # Face ID. The system's own question already names Face ID or Optic ID.
        NSFaceIDUsageDescription: Nextcloud Photos uses this to unlock the app and your archived photos.
        NSLocalNetworkUsageDescription: Nextcloud Photos connects to Nextcloud servers on your local network.
        NSAppTransportSecurity:
          # Nextcloud servers are self-hosted and their address is typed in by the user: plain http (home networks) and
          # TLS setups that ATS rejects must stay possible. Per-host exceptions (SPEC §8) cannot be used, the hosts are
          # not known at build time. The app asks before it signs in over http and before it trusts an unknown
          # certificate. App Review justification: docs/PRIVACY-AND-EXPORT.md.
          NSAllowsArbitraryLoads: true
        # The backup's Live Activity (SPEC §15.4; iPhone and iPad, ignored elsewhere).
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PHOTOS_BUNDLE_ID)
            CFBundleURLSchemes: [nextcloudphotos]
        LSApplicationQueriesSchemes: [nextcloud, nextcloudtalk, nextcloudnotes]
        # Refresh, processing and on-device labels (`ContentLabeling`) have fixed identifiers. The last one is the
        # user-started backup as a continued processing task (`ContinuedBackup`): its identifier must start with the bundle
        # identifier, and the system expects a wildcard.
        BGTaskSchedulerPermittedIdentifiers:
          - com.nextcloud.photos.refresh
          - com.nextcloud.photos.processing
          - com.nextcloud.photos.labels
          - $(PRODUCT_BUNDLE_IDENTIFIER).backup.*
        UIBackgroundModes: [fetch, processing, remote-notification]
  ShareExtension:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Extensions/ShareExtension
        excludes: ["*.entitlements"]
    dependencies:
      - package: PhotosKit
        product: PhotosAppUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).share
        PRODUCT_NAME: ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # Entitlements: always in Release, in Debug only with PHOTOS_DEBUG_ENTITLEMENTS = YES (Config/Base.xcconfig).
        PHOTOS_ENTITLEMENTS_NO: ""
        PHOTOS_ENTITLEMENTS_YES: Extensions/ShareExtension/ShareExtension.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_$(PHOTOS_DEBUG_ENTITLEMENTS))
        Release:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_YES)
    info:
      path: Extensions/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        # With app lock on, sharing to the app needs the same unlock as the app (SPEC §8).
        NSFaceIDUsageDescription: Nextcloud Photos uses this to unlock the app and your archived photos.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 100
              NSExtensionActivationSupportsFileWithMaxCount: 100
  NotificationService:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Extensions/NotificationService
        excludes: ["*.entitlements"]
    dependencies:
      - package: PhotosKit
        product: PhotosCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).notification-service
        PRODUCT_NAME: NotificationService
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # Entitlements: always in Release, in Debug only with PHOTOS_DEBUG_ENTITLEMENTS = YES (Config/Base.xcconfig).
        PHOTOS_ENTITLEMENTS_NO: ""
        PHOTOS_ENTITLEMENTS_YES: Extensions/NotificationService/NotificationService.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_$(PHOTOS_DEBUG_ENTITLEMENTS))
        Release:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_YES)
    info:
      path: Extensions/NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  Widgets:
    type: app-extension
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: Extensions/Widgets
        excludes: ["*.entitlements"]
      # The controls' intents: compiled here for the controls, performed in the app (SPEC §15.4).
      - path: App/Shared/AmbientIntents.swift
    dependencies:
      - package: PhotosKit
        product: PhotosCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).widgets
        PRODUCT_NAME: Widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # Entitlements: always in Release, in Debug only with PHOTOS_DEBUG_ENTITLEMENTS = YES (Config/Base.xcconfig).
        PHOTOS_ENTITLEMENTS_NO: ""
        PHOTOS_ENTITLEMENTS_YES: Extensions/Widgets/Widgets.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_$(PHOTOS_DEBUG_ENTITLEMENTS))
        Release:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_YES)
    info:
      path: Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # PhotoKit's background-upload extension (SPEC §7.18.6): the system starts it while backup is on, also when the app is not
  # running, and sends photos and videos up to 100 MB from the library. An ExtensionKit extension (`EXAppExtensionAttributes`).
  BackgroundUpload:
    type: extensionkit-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Extensions/BackgroundUpload
        excludes: ["*.entitlements"]
    dependencies:
      - package: PhotosKit
        product: PhotosCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).background-upload
        PRODUCT_NAME: BackgroundUpload
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_RESOURCE_ACCESS_PHOTO_LIBRARY: YES
        # Entitlements: always in Release, in Debug only with PHOTOS_DEBUG_ENTITLEMENTS = YES (Config/Base.xcconfig).
        PHOTOS_ENTITLEMENTS_NO: ""
        PHOTOS_ENTITLEMENTS_YES: Extensions/BackgroundUpload/BackgroundUpload.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_$(PHOTOS_DEBUG_ENTITLEMENTS))
        Release:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_YES)
    info:
      path: Extensions/BackgroundUpload/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.photos.background-upload
  # Smoke tests of the running app against a test server; not part of PR CI (docs/TESTING.md).
  NextcloudPhotosUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
    dependencies:
      - target: NextcloudPhotos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).uitests
        TEST_TARGET_NAME: NextcloudPhotos
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NextcloudPhotos:
    build:
      targets:
        NextcloudPhotos: all
    test:
      gatherCoverageData: true
  NextcloudPhotosUITests:
    build:
      targets:
        NextcloudPhotos: all
        NextcloudPhotosUITests: [test]
    test:
      targets:
        - NextcloudPhotosUITests
