name: NextcloudPhotos
options:
  bundleIdPrefix: com.nextcloud
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
    visionOS: "27.0"
    tvOS: "27.0"
    watchOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # CI passes PHOTOS_WARNINGS_AS_ERRORS=YES (Config/Base.xcconfig): a warning in the app's own targets fails the build.
    # Project settings do not reach the Swift packages; PhotosKit reads the same name from the environment (Package.swift).
    SWIFT_TREAT_WARNINGS_AS_ERRORS: $(PHOTOS_WARNINGS_AS_ERRORS)
    GCC_TREAT_WARNINGS_AS_ERRORS: $(PHOTOS_WARNINGS_AS_ERRORS)
packages:
  PhotosKit:
    path: Packages/PhotosKit
targets:
  NextcloudPhotos:
    type: application
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: App/Shared
      - path: App/Resources
      # The app icon (Icon Composer): Xcode renders its default, dark, clear and tinted looks for iOS, iPadOS and macOS.
      - path: icon/Photos App Icon.icon
        destinationFilters: [iOS, macOS]
    dependencies:
      - package: PhotosKit
        product: PhotosAppUI
      - package: PhotosKit
        product: PhotosCore
      # Neither extension point exists on visionOS: an app that embeds them does not install there.
      - target: ShareExtension
        embed: true
        destinationFilters: [iOS, macOS]
      - target: NotificationService
        embed: true
        destinationFilters: [iOS, macOS]
      - target: Widgets
        embed: true
      # PhotoKit's background uploads (SPEC §7.18.6); not on visionOS.
      - target: BackgroundUpload
        embed: true
        destinationFilters: [iOS, macOS]
      # The Apple Watch app (SPEC §15.3) comes with the iPhone app.
      - target: NextcloudPhotosWatch
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID)
        PRODUCT_NAME: Nextcloud Photos
        TARGETED_DEVICE_FAMILY: "1,2,7"
        ASSETCATALOG_COMPILER_APPICON_NAME: Photos App Icon
        # Vision Pro: Icon Composer has no visionOS look; a three-layer image stack from the same artwork
        # (scripts/make-icon-layers.swift).
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xros*]: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xrsimulator*]: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Nextcloud Photos
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_RESOURCE_ACCESS_PHOTO_LIBRARY: YES
        # Import from a camera connected by USB (ImageCaptureCore in the sandbox, SPEC §15.2).
        ENABLE_RESOURCE_ACCESS_USB: YES
        # Entitlements: always in Release, in Debug only with PHOTOS_DEBUG_ENTITLEMENTS = YES (Config/Base.xcconfig).
        PHOTOS_ENTITLEMENTS_NO: ""
        PHOTOS_ENTITLEMENTS_YES: App/NextcloudPhotos.entitlements
        # macOS spells the push entitlement differently (com.apple.developer.aps-environment).
        "PHOTOS_ENTITLEMENTS_YES[sdk=macosx*]": App/NextcloudPhotos-macOS.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_$(PHOTOS_DEBUG_ENTITLEMENTS))
        Release:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_YES)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only encryption that is exempt: HTTPS, the keychain, and standard algorithms of the system (RSA, SHA-2) for
        # push notifications and checksums. Reasoning: docs/PRIVACY-AND-EXPORT.md.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.photography
        UILaunchScreen: {}
        # Several windows on iPad (album windows, File ▸ New Window) and Vision Pro's immersive spaces (memory room,
        # panorama). The key only counts inside the scene manifest; at the top level the system ignored it.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        NSPhotoLibraryUsageDescription: Nextcloud Photos backs up your photos and videos to your Nextcloud when you turn on backup, and keeps copies of an album you choose for the Lock Screen.
        NSPhotoLibraryAddUsageDescription: Nextcloud Photos saves photos and videos from your Nextcloud to your photo library when you ask it to.
        NSCameraUsageDescription: Nextcloud Photos uses the camera to take photos and scan documents for your Nextcloud, and to scan a login QR code.
        # iPhone and iPad: a song of the Music library as the music of memory slideshows (SPEC ME-4), only when the user
        # picks one.
        NSAppleMusicUsageDescription: Nextcloud Photos plays the song you choose from your music library during memory slideshows.
        # One text for every platform: Info.plist values cannot vary by device (a string catalog's device variations end
        # up in InfoPlist.stringsdict, which the system does not read for Info.plist keys), and the Mac must not say
        # Face ID. The system's own question already names Face ID or Optic ID.
        NSFaceIDUsageDescription: Nextcloud Photos uses this to unlock the app and your archived photos.
        NSLocalNetworkUsageDescription: Nextcloud Photos connects to Nextcloud servers on your local network.
        # Import from a memory card (Mac, SPEC §15.2): macOS asks before an app reads a removable volume.
        NSRemovableVolumesUsageDescription: Nextcloud Photos reads the photos and videos on memory cards you import from.
        NSAppTransportSecurity:
          # Nextcloud servers are self-hosted and their address is typed in by the user: plain http (home networks) and
          # TLS setups that ATS rejects must stay possible. Per-host exceptions (SPEC §8) cannot be used, the hosts are
          # not known at build time. The app asks before it signs in over http and before it trusts an unknown
          # certificate. App Review justification: docs/PRIVACY-AND-EXPORT.md.
          NSAllowsArbitraryLoads: true
        # The backup's Live Activity (SPEC §15.4; iPhone and iPad, ignored elsewhere).
        NSSupportsLiveActivities: true
        # A photo of the library dragged between the app's windows (`LibraryItemReference`); never leaves the app.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.nextcloud.photos.library-item
            UTTypeDescription: Nextcloud Photos library item
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
        CFBundleURLTypes:
          - CFBundleURLName: $(PHOTOS_BUNDLE_ID)
            CFBundleURLSchemes: [nextcloudphotos]
        LSApplicationQueriesSchemes: [nextcloud, nextcloudtalk, nextcloudnotes]
        # Refresh, processing, on-device labels (`ContentLabeling`) and smart offline (`SmartOfflineScheduling`) have fixed
        # identifiers. The last one is the user-started backup as a continued processing task (`ContinuedBackup`): its
        # identifier must start with the bundle identifier, and the system expects a wildcard.
        BGTaskSchedulerPermittedIdentifiers:
          - com.nextcloud.photos.refresh
          - com.nextcloud.photos.processing
          - com.nextcloud.photos.labels
          - com.nextcloud.photos.similar
          - com.nextcloud.photos.describe
          - com.nextcloud.photos.offline
          - $(PRODUCT_BUNDLE_IDENTIFIER).backup.*
        UIBackgroundModes: [fetch, processing, remote-notification]
  ShareExtension:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Extensions/ShareExtension
        excludes: ["*.entitlements"]
    dependencies:
      - package: PhotosKit
        product: PhotosAppUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).share
        PRODUCT_NAME: ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # Entitlements: always in Release, in Debug only with PHOTOS_DEBUG_ENTITLEMENTS = YES (Config/Base.xcconfig).
        PHOTOS_ENTITLEMENTS_NO: ""
        PHOTOS_ENTITLEMENTS_YES: Extensions/ShareExtension/ShareExtension.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_$(PHOTOS_DEBUG_ENTITLEMENTS))
        Release:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_YES)
    info:
      path: Extensions/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        # With app lock on, sharing to the app needs the same unlock as the app (SPEC §8).
        NSFaceIDUsageDescription: Nextcloud Photos uses this to unlock the app and your archived photos.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 100
              NSExtensionActivationSupportsFileWithMaxCount: 100
  NotificationService:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Extensions/NotificationService
        excludes: ["*.entitlements"]
    dependencies:
      - package: PhotosKit
        product: PhotosCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).notification-service
        PRODUCT_NAME: NotificationService
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # Entitlements: always in Release, in Debug only with PHOTOS_DEBUG_ENTITLEMENTS = YES (Config/Base.xcconfig).
        PHOTOS_ENTITLEMENTS_NO: ""
        PHOTOS_ENTITLEMENTS_YES: Extensions/NotificationService/NotificationService.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_$(PHOTOS_DEBUG_ENTITLEMENTS))
        Release:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_YES)
    info:
      path: Extensions/NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  Widgets:
    type: app-extension
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: Extensions/Widgets
        excludes: ["*.entitlements"]
      # The controls' intents: compiled here for the controls, performed in the app (SPEC §15.4).
      - path: App/Shared/AmbientIntents.swift
    dependencies:
      - package: PhotosKit
        product: PhotosCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).widgets
        PRODUCT_NAME: Widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # Entitlements: always in Release, in Debug only with PHOTOS_DEBUG_ENTITLEMENTS = YES (Config/Base.xcconfig).
        PHOTOS_ENTITLEMENTS_NO: ""
        PHOTOS_ENTITLEMENTS_YES: Extensions/Widgets/Widgets.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_$(PHOTOS_DEBUG_ENTITLEMENTS))
        Release:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_YES)
    info:
      path: Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # PhotoKit's background-upload extension (SPEC §7.18.6): the system starts it while backup is on, also when the app is not
  # running, and sends photos and videos up to 100 MB from the library. An ExtensionKit extension (`EXAppExtensionAttributes`).
  BackgroundUpload:
    type: extensionkit-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Extensions/BackgroundUpload
        excludes: ["*.entitlements"]
    dependencies:
      - package: PhotosKit
        product: PhotosCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).background-upload
        PRODUCT_NAME: BackgroundUpload
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_RESOURCE_ACCESS_PHOTO_LIBRARY: YES
        # Entitlements: always in Release, in Debug only with PHOTOS_DEBUG_ENTITLEMENTS = YES (Config/Base.xcconfig).
        PHOTOS_ENTITLEMENTS_NO: ""
        PHOTOS_ENTITLEMENTS_YES: Extensions/BackgroundUpload/BackgroundUpload.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_$(PHOTOS_DEBUG_ENTITLEMENTS))
        Release:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_YES)
    info:
      path: Extensions/BackgroundUpload/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.photos.background-upload
  # Apple TV (SPEC §15.3): its own app with screens for the Siri Remote, on PhotosCore like the other platforms.
  NextcloudPhotosTV:
    type: application
    platform: tvOS
    sources:
      - path: App/TV
        excludes: ["*.entitlements", "Info.plist"]
    dependencies:
      - package: PhotosKit
        product: PhotosCore
      - target: TopShelf
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).tv
        PRODUCT_NAME: Nextcloud Photos
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Entitlements: always in Release, in Debug only with PHOTOS_DEBUG_ENTITLEMENTS = YES (Config/Base.xcconfig).
        PHOTOS_ENTITLEMENTS_NO: ""
        PHOTOS_ENTITLEMENTS_YES: App/TV/NextcloudPhotosTV.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_$(PHOTOS_DEBUG_ENTITLEMENTS))
        Release:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_YES)
    info:
      path: App/TV/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.photography
        UILaunchScreen: {}
        UIUserInterfaceStyle: Automatic
        NSLocalNetworkUsageDescription: Nextcloud Photos connects to Nextcloud servers on your local network.
        # As on the other platforms: self-hosted servers, addresses typed in by the user (docs/PRIVACY-AND-EXPORT.md).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # The Top Shelf opens memories with nextcloudphotos://memories/<id>[/play].
        CFBundleURLTypes:
          - CFBundleURLName: $(PHOTOS_BUNDLE_ID).tv
            CFBundleURLSchemes: [nextcloudphotos]
  # The Top Shelf of the TV app: recent memories from what the app leaves in the App Group (no account, no network).
  TopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: Extensions/TopShelf
        excludes: ["*.entitlements"]
    dependencies:
      - package: PhotosKit
        product: PhotosModel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).tv.topshelf
        PRODUCT_NAME: TopShelf
        SKIP_INSTALL: YES
        PHOTOS_ENTITLEMENTS_NO: ""
        PHOTOS_ENTITLEMENTS_YES: Extensions/TopShelf/TopShelf.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_$(PHOTOS_DEBUG_ENTITLEMENTS))
        Release:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_YES)
    info:
      path: Extensions/TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
  # Apple Watch (SPEC §15.3): today's photos and favourites sent by the iPhone app (WatchConnectivity); no login on the watch.
  NextcloudPhotosWatch:
    type: application
    platform: watchOS
    sources:
      - path: App/Watch
        excludes: ["*.entitlements", "Info.plist"]
      # The same Icon Composer file as the iPhone app: its watchOS (circle) look.
      - path: icon/Photos App Icon.icon
    dependencies:
      - package: PhotosKit
        product: PhotosModel
      - target: WatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: Nextcloud Photos
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: Photos App Icon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        PHOTOS_ENTITLEMENTS_NO: ""
        PHOTOS_ENTITLEMENTS_YES: App/Watch/NextcloudPhotosWatch.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_$(PHOTOS_DEBUG_ENTITLEMENTS))
        Release:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_YES)
    info:
      path: App/Watch/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(PHOTOS_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: false
  # The watch face complication: the photo of the day from the watch app's App Group.
  WatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Extensions/WatchWidgets
        excludes: ["*.entitlements"]
    dependencies:
      - package: PhotosKit
        product: PhotosModel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).watchkitapp.widgets
        PRODUCT_NAME: WatchWidgets
        SKIP_INSTALL: YES
        PHOTOS_ENTITLEMENTS_NO: ""
        PHOTOS_ENTITLEMENTS_YES: Extensions/WatchWidgets/WatchWidgets.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_$(PHOTOS_DEBUG_ENTITLEMENTS))
        Release:
          CODE_SIGN_ENTITLEMENTS: $(PHOTOS_ENTITLEMENTS_YES)
    info:
      path: Extensions/WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # A tour of the Apple TV app with the Siri Remote (XCUIRemote) against a test server; not part of PR CI (docs/TESTING.md).
  NextcloudPhotosTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: UITestsTV
    dependencies:
      - target: NextcloudPhotosTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).tv.uitests
        TEST_TARGET_NAME: NextcloudPhotosTV
        GENERATE_INFOPLIST_FILE: YES
  # Smoke tests of the running app against a test server; not part of PR CI (docs/TESTING.md).
  NextcloudPhotosUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: UITests
    dependencies:
      - target: NextcloudPhotos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).uitests
        TEST_TARGET_NAME: NextcloudPhotos
        TARGETED_DEVICE_FAMILY: "1,2,7"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NextcloudPhotosTV:
    build:
      targets:
        NextcloudPhotosTV: all
        NextcloudPhotosTVUITests: [test]
    test:
      targets:
        - NextcloudPhotosTVUITests
  NextcloudPhotosWatch:
    build:
      targets:
        NextcloudPhotosWatch: all
  NextcloudPhotos:
    build:
      targets:
        NextcloudPhotos: all
    test:
      gatherCoverageData: true
  NextcloudPhotosUITests:
    build:
      targets:
        NextcloudPhotos: all
        NextcloudPhotosUITests: [test]
    test:
      targets:
        - NextcloudPhotosUITests
