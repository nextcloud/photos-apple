name: NextcloudPhotos
options:
  bundleIdPrefix: com.nextcloud
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
    visionOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  PhotosKit:
    path: Packages/PhotosKit
targets:
  NextcloudPhotos:
    type: application
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: App/Shared
      - path: App/Resources
    dependencies:
      - package: PhotosKit
        product: PhotosAppUI
      - package: PhotosKit
        product: PhotosCore
      - target: ShareExtension
        embed: true
      - target: NotificationService
        embed: true
      - target: Widgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID)
        PRODUCT_NAME: Nextcloud Photos
        TARGETED_DEVICE_FAMILY: "1,2,7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Nextcloud Photos
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_RESOURCE_ACCESS_PHOTO_LIBRARY: YES
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: App/NextcloudPhotos.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.photography
        UILaunchScreen: {}
        UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
        NSPhotoLibraryUsageDescription: Nextcloud Photos backs up your photos and videos to your Nextcloud when you turn on backup.
        NSPhotoLibraryAddUsageDescription: Nextcloud Photos saves photos and videos from your Nextcloud to your photo library when you ask it to.
        NSCameraUsageDescription: Nextcloud Photos uses the camera to scan login QR codes and to take photos directly to your Nextcloud.
        NSFaceIDUsageDescription: Nextcloud Photos uses Face ID to protect the app and your archived photos.
        NSLocalNetworkUsageDescription: Nextcloud Photos connects to Nextcloud servers on your local network.
        NSAppTransportSecurity:
          # Nextcloud servers are self-hosted: http and self-signed certificates must be possible (user-approved per host).
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PHOTOS_BUNDLE_ID)
            CFBundleURLSchemes: [nextcloudphotos]
        LSApplicationQueriesSchemes: [nextcloud, nextcloudtalk, nextcloudnotes]
        BGTaskSchedulerPermittedIdentifiers: [com.nextcloud.photos.refresh, com.nextcloud.photos.processing]
        UIBackgroundModes: [fetch, processing]
  ShareExtension:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Extensions/ShareExtension
        excludes: ["*.entitlements"]
    dependencies:
      - package: PhotosKit
        product: PhotosAppUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).share
        PRODUCT_NAME: ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Extensions/ShareExtension/ShareExtension.entitlements
    info:
      path: Extensions/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 100
              NSExtensionActivationSupportsFileWithMaxCount: 100
  NotificationService:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Extensions/NotificationService
        excludes: ["*.entitlements"]
    dependencies:
      - package: PhotosKit
        product: PhotosCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).notification-service
        PRODUCT_NAME: NotificationService
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Extensions/NotificationService/NotificationService.entitlements
    info:
      path: Extensions/NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  Widgets:
    type: app-extension
    supportedDestinations: [iOS, macOS, visionOS]
    sources:
      - path: Extensions/Widgets
        excludes: ["*.entitlements"]
    dependencies:
      - package: PhotosKit
        product: PhotosCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PHOTOS_BUNDLE_ID).widgets
        PRODUCT_NAME: Widgets
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Extensions/Widgets/Widgets.entitlements
    info:
      path: Extensions/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Nextcloud Photos
        PhotosAppGroup: group.$(PHOTOS_BUNDLE_ID)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  NextcloudPhotos:
    build:
      targets:
        NextcloudPhotos: all
    test:
      gatherCoverageData: true
