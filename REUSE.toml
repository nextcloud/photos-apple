version = 1
SPDX-PackageName = "photos-ios"
SPDX-PackageSupplier = "Nextcloud <info@nextcloud.com>"
SPDX-PackageDownloadLocation = "https://github.com/nextcloud/photos-ios"

[[annotations]]
path = ["docs/**", "README.md", "project.yml", ".swift-format", "**/*.json", "**/*.plist", "**/*.xcstrings", "**/*.entitlements", "**/Package.resolved", "Packages/PhotosKit/Tests/**/Fixtures/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Nextcloud GmbH and Nextcloud contributors"
SPDX-License-Identifier = "MIT"

# The app icon: the Icon Composer file and its glyph (iOS, iPadOS, macOS, watchOS), and the layers made from them for
# Apple TV (icon, Top Shelf) and Vision Pro by scripts/make-icon-layers.swift.
[[annotations]]
path = ["icon/**", "App/TV/Assets.xcassets/**/*.png", "App/Resources/Assets.xcassets/AppIcon.solidimagestack/**/*.png"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Nextcloud GmbH"
SPDX-License-Identifier = "LicenseRef-NextcloudTrademarks"

# Screenshots: the app's UI (MIT) showing sample photos from Wikimedia Commons, each under its own licence, and Apple Maps data.
[[annotations]]
path = ["docs/screenshots/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Nextcloud GmbH and Nextcloud contributors", "Wikimedia Commons contributors", "Apple Inc. and its map data providers"]
SPDX-License-Identifier = "LicenseRef-Screenshots"
