name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: swift-format
        run: |
          FILES=$(git ls-files '*.swift')
          xcrun swift-format lint --strict --configuration .swift-format $FILES

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REUSE
        uses: fsfe/reuse-action@v5

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: Packages/PhotosKit
        # xcodebuild (not `swift test`) builds the resource bundles of dependencies such as NextcloudKit.
        # The app targets OS 27; hosted runners run macOS 26, so tests run on an iOS 27 simulator when one exists.
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ids = [d["udid"] for runtime, devices in data.items() if "iOS-27" in runtime for d in devices if d["name"].startswith("iPhone")]
          print(ids[0] if ids else "")')
          if [ "$(sw_vers -productVersion | cut -d. -f1)" -ge 27 ]; then
            xcodebuild test -scheme PhotosKit-Package -destination 'platform=macOS' -skipPackagePluginValidation
          elif [ -n "$DEVICE" ]; then
            xcodebuild test -scheme PhotosKit-Package -destination "id=$DEVICE" -skipPackagePluginValidation
          else
            echo "::warning::No macOS 27 runner or iOS 27 simulator available; unit tests skipped."
          fi

  build:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        destination: ["generic/platform=iOS Simulator", "platform=macOS", "generic/platform=visionOS Simulator"]
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          xcodebuild -project NextcloudPhotos.xcodeproj -scheme NextcloudPhotos -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- build
