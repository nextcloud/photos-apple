name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Warnings fail the build in our own code (SPEC §20.5): PhotosKit reads this from the environment (Package.swift), the app
  # targets get it as a build setting on the xcodebuild command line (Config/Base.xcconfig). Dependencies are not affected.
  PHOTOS_WARNINGS_AS_ERRORS: "YES"

jobs:
  lint:
    # swift-format comes with Xcode and its rules change between versions, so the job uses the Xcode the code is
    # formatted with (27.2), not the image's default.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: swift-format
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::Xcode 27.2 is not on this image any more; change DEVELOPER_DIR in the lint job (and reformat with that Xcode)."
            exit 1
          fi
          xcrun swift-format --version
          FILES=$(git ls-files '*.swift')
          xcrun swift-format lint --strict --configuration .swift-format $FILES

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: REUSE
        uses: fsfe/reuse-action@v6

  test:
    # The package targets OS 27, so its test bundles only load on macOS 27. `xcode-27` is GitHub's hosted macOS 27 image with
    # Xcode 27 (public preview, https://github.com/actions/runner-images/issues/14404); `macos-26` cannot run them.
    # Switch to `macos-27` once that label exists.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        working-directory: Packages/PhotosKit
        run: |
          set -o pipefail
          OS=$(sw_vers -productVersion)
          if [ "${OS%%.*}" -lt 27 ]; then
            echo "::error::Unit tests need macOS 27 (the package's deployment target); this runner has macOS $OS."
            exit 1
          fi
          # The timing tests on a 100 000-item library take minutes; pull requests skip them, pushes to main and the
          # nightly workflow run them. xcodebuild only hands variables with this prefix to the test process (without it).
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            export TEST_RUNNER_PHOTOS_SKIP_PERFORMANCE=1
          fi
          xcodebuild test -scheme PhotosKit-Package -destination 'platform=macOS' -skipPackagePluginValidation \
            | tee "$RUNNER_TEMP/unit-tests.log"
      - name: No warnings
        run: .github/scripts/check-warnings.sh "$RUNNER_TEMP/unit-tests.log"
      - name: Test summary
        # A green job must mean that tests ran: count them and fail when there were none.
        if: always()
        run: |
          LOG="$RUNNER_TEMP/unit-tests.log"
          TOTAL=0
          if [ -f "$LOG" ]; then
            TOTAL=$(grep -Eo 'Test run with [0-9]+ tests?' "$LOG" | awk '{ sum += $4 } END { print sum + 0 }')
          fi
          {
            echo "### Unit tests"
            echo "macOS $(sw_vers -productVersion), $(xcodebuild -version | head -1): Swift Testing ran **$TOTAL** tests."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No unit test ran."
            exit 1
          fi

  test-ios:
    # The same tests in an iOS 27 simulator: the iOS code paths (UIKit, background sessions) only compile and run there.
    runs-on: xcode-27
    # A hanging test must not hold a runner for GitHub's six hours (it happened once in the media tests).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Find an iOS 27 simulator
        id: simulator
        run: |
          xcrun simctl list runtimes
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(xcrun simctl list devices available -j | python3 .github/scripts/pick-simulator.py "$SDK")
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator with an iOS 27 runtime on this runner (SDK $SDK); see the list of runtimes above."
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        working-directory: Packages/PhotosKit
        env:
          # Always skipped here: the timings are measured on the Mac.
          TEST_RUNNER_PHOTOS_SKIP_PERFORMANCE: "1"
        run: |
          set -o pipefail
          xcodebuild test -scheme PhotosKit-Package -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -skipPackagePluginValidation | tee "$RUNNER_TEMP/unit-tests-ios.log"
      - name: No warnings
        run: .github/scripts/check-warnings.sh "$RUNNER_TEMP/unit-tests-ios.log"
      - name: Test summary
        if: always()
        run: |
          LOG="$RUNNER_TEMP/unit-tests-ios.log"
          TOTAL=0
          if [ -f "$LOG" ]; then
            TOTAL=$(grep -Eo 'Test run with [0-9]+ tests?' "$LOG" | awk '{ sum += $4 } END { print sum + 0 }')
          fi
          echo "### Unit tests (iOS Simulator): Swift Testing ran **$TOTAL** tests." >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No unit test ran in the simulator."
            exit 1
          fi
  build:
    # Same image as the tests: the app targets OS 27 and uses API from the 27 SDKs (e.g. `PHAssetResource.dataSize`).
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        scheme: [NextcloudPhotos]
        destination: ["generic/platform=iOS Simulator", "platform=macOS", "generic/platform=visionOS Simulator"]
        # Apple TV and Apple Watch (SPEC §15.3); the iOS build above includes the watch app too.
        include:
          - scheme: NextcloudPhotosTV
            destination: "generic/platform=tvOS Simulator"
          - scheme: NextcloudPhotosWatch
            destination: "generic/platform=watchOS Simulator"
    steps:
      - uses: actions/checkout@v7
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project NextcloudPhotos.xcodeproj -scheme '${{ matrix.scheme }}' -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- PHOTOS_WARNINGS_AS_ERRORS=YES build | tee "$RUNNER_TEMP/build.log"
      - name: No warnings
        run: .github/scripts/check-warnings.sh "$RUNNER_TEMP/build.log"
  release-build:
    # The Release configuration differs from Debug (optimisation, entitlements, no debug-only code): archive it without
    # signing so that it keeps compiling. Signed archives are made by the release workflow.
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        destination: ["generic/platform=iOS", "generic/platform=macOS", "generic/platform=visionOS"]
    steps:
      - uses: actions/checkout@v7
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Archive (unsigned)
        run: |
          xcodebuild archive -project NextcloudPhotos.xcodeproj -scheme NextcloudPhotos -configuration Release \
            -destination '${{ matrix.destination }}' -archivePath "$RUNNER_TEMP/NextcloudPhotos.xcarchive" \
            CODE_SIGNING_ALLOWED=NO PHOTOS_WARNINGS_AS_ERRORS=YES
  ui-smoke:
    # The app itself in an iPhone simulator, against a throw-away Nextcloud with the sample photos of a new account
    # (scripts/test-server.sh, as in the nightly integration job): launch and Library, the viewer, Albums, Collections,
    # the Settings sheet, the filter menu and Clean up (UITests/SmokeTests.swift). Screenshots and the result bundle are
    # kept as an artifact. The tours only look and navigate; the server is gone with the runner.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      SERVER_URL: http://127.0.0.1:8089
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, curl, dom, exif, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, posix, session, simplexml, sqlite3, xmlreader, xmlwriter, zip, zlib
          coverage: none
      - name: Start Nextcloud
        run: |
          scripts/test-server.sh "$RUNNER_TEMP/nextcloud" 8089 > "$RUNNER_TEMP/nextcloud.log" 2>&1 &
          for _ in $(seq 1 120); do
            if [ -f "$RUNNER_TEMP/nextcloud/ready" ]; then break; fi
            sleep 5
          done
          tail -n 40 "$RUNNER_TEMP/nextcloud.log"
          if [ ! -f "$RUNNER_TEMP/nextcloud/ready" ]; then
            echo "::error::The test server did not come up within 10 minutes."
            exit 1
          fi
          curl -fsS "$SERVER_URL/status.php"
      - name: Boot an iPhone simulator
        id: simulator
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(xcrun simctl list devices available -j | python3 .github/scripts/pick-simulator.py "$SDK")
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator with an iOS 27 runtime on this runner (SDK $SDK)."
            exit 1
          fi
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: UI smoke tests
        env:
          # xcodebuild hands variables with this prefix to the test runner (without the prefix).
          TEST_RUNNER_PHOTOS_UITEST_LOGIN: nc://login/server:${{ env.SERVER_URL }}&user:admin&password:admin
          TEST_RUNNER_PHOTOS_UITEST_SHOTS: ${{ runner.temp }}/ui-smoke-shots
        run: |
          set -o pipefail
          # A bundle id of its own (the tests refuse the official one); entitlements on, or the keychain cannot keep the
          # login in the simulator.
          xcodebuild test -project NextcloudPhotos.xcodeproj -scheme NextcloudPhotosUITests \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:NextcloudPhotosUITests/SmokeTests -resultBundlePath "$RUNNER_TEMP/ui-smoke.xcresult" \
            PHOTOS_BUNDLE_ID=com.nextcloud.photos.ci PHOTOS_DEBUG_ENTITLEMENTS=YES PHOTOS_WARNINGS_AS_ERRORS=YES \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | tee "$RUNNER_TEMP/ui-smoke.log"
      - name: Test summary
        # Green must mean that the tours ran: a skipped test (no login reached the runner) fails the job too.
        if: always()
        run: |
          if [ ! -d "$RUNNER_TEMP/ui-smoke.xcresult" ]; then
            echo "::error::No result bundle: the UI tests did not run."
            exit 1
          fi
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/ui-smoke.xcresult" --compact \
            | python3 .github/scripts/ui-test-summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Keep screenshots and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke
          path: |
            ${{ runner.temp }}/ui-smoke-shots
            ${{ runner.temp }}/ui-smoke.xcresult
          if-no-files-found: ignore
          retention-days: 14
      - name: Server log
        if: failure()
        run: |
          tail -n 100 "$RUNNER_TEMP/nextcloud.log" || true
          tail -n 50 "$RUNNER_TEMP/nextcloud/nextcloud/data/nextcloud.log" || true
