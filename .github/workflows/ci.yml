name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # swift-format comes with Xcode and its rules change between versions, so the job uses the Xcode the code is
    # formatted with (27.2), not the image's default.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: swift-format
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::Xcode 27.2 is not on this image any more; change DEVELOPER_DIR in the lint job (and reformat with that Xcode)."
            exit 1
          fi
          xcrun swift-format --version
          FILES=$(git ls-files '*.swift')
          xcrun swift-format lint --strict --configuration .swift-format $FILES

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: REUSE
        uses: fsfe/reuse-action@v6

  test:
    # The package targets OS 27, so its test bundles only load on macOS 27. `xcode-27` is GitHub's hosted macOS 27 image with
    # Xcode 27 (public preview, https://github.com/actions/runner-images/issues/14404); `macos-26` cannot run them.
    # Switch to `macos-27` once that label exists.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        working-directory: Packages/PhotosKit
        run: |
          set -o pipefail
          OS=$(sw_vers -productVersion)
          if [ "${OS%%.*}" -lt 27 ]; then
            echo "::error::Unit tests need macOS 27 (the package's deployment target); this runner has macOS $OS."
            exit 1
          fi
          # The timing tests on a 100 000-item library take minutes; pull requests skip them, pushes to main and the
          # nightly workflow run them. xcodebuild only hands variables with this prefix to the test process (without it).
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            export TEST_RUNNER_PHOTOS_SKIP_PERFORMANCE=1
          fi
          xcodebuild test -scheme PhotosKit-Package -destination 'platform=macOS' -skipPackagePluginValidation \
            | tee "$RUNNER_TEMP/unit-tests.log"
      - name: Test summary
        # A green job must mean that tests ran: count them and fail when there were none.
        if: always()
        run: |
          LOG="$RUNNER_TEMP/unit-tests.log"
          TOTAL=0
          if [ -f "$LOG" ]; then
            TOTAL=$(grep -Eo 'Test run with [0-9]+ tests?' "$LOG" | awk '{ sum += $4 } END { print sum + 0 }')
          fi
          {
            echo "### Unit tests"
            echo "macOS $(sw_vers -productVersion), $(xcodebuild -version | head -1): Swift Testing ran **$TOTAL** tests."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No unit test ran."
            exit 1
          fi

  test-ios:
    # The same tests in an iOS 27 simulator: the iOS code paths (UIKit, background sessions) only compile and run there.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Find an iOS 27 simulator
        id: simulator
        run: |
          xcrun simctl list runtimes
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(xcrun simctl list devices available -j | python3 .github/scripts/pick-simulator.py "$SDK")
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator with an iOS 27 runtime on this runner (SDK $SDK); see the list of runtimes above."
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        working-directory: Packages/PhotosKit
        env:
          # Always skipped here: the timings are measured on the Mac.
          TEST_RUNNER_PHOTOS_SKIP_PERFORMANCE: "1"
        run: |
          set -o pipefail
          xcodebuild test -scheme PhotosKit-Package -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -skipPackagePluginValidation | tee "$RUNNER_TEMP/unit-tests-ios.log"
      - name: Test summary
        if: always()
        run: |
          LOG="$RUNNER_TEMP/unit-tests-ios.log"
          TOTAL=0
          if [ -f "$LOG" ]; then
            TOTAL=$(grep -Eo 'Test run with [0-9]+ tests?' "$LOG" | awk '{ sum += $4 } END { print sum + 0 }')
          fi
          echo "### Unit tests (iOS Simulator): Swift Testing ran **$TOTAL** tests." >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No unit test ran in the simulator."
            exit 1
          fi
  build:
    # Same image as the tests: the app targets OS 27 and uses API from the 27 SDKs (e.g. `PHAssetResource.dataSize`).
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        destination: ["generic/platform=iOS Simulator", "platform=macOS", "generic/platform=visionOS Simulator"]
    steps:
      - uses: actions/checkout@v7
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          xcodebuild -project NextcloudPhotos.xcodeproj -scheme NextcloudPhotos -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- build
  release-build:
    # The Release configuration differs from Debug (optimisation, entitlements, no debug-only code): archive it without
    # signing so that it keeps compiling. Signed archives are made by the release workflow.
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        destination: ["generic/platform=iOS", "generic/platform=macOS", "generic/platform=visionOS"]
    steps:
      - uses: actions/checkout@v7
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Archive (unsigned)
        run: |
          xcodebuild archive -project NextcloudPhotos.xcodeproj -scheme NextcloudPhotos -configuration Release \
            -destination '${{ matrix.destination }}' -archivePath "$RUNNER_TEMP/NextcloudPhotos.xcarchive" \
            CODE_SIGNING_ALLOWED=NO
