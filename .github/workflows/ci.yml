name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: swift-format
        run: |
          FILES=$(git ls-files '*.swift')
          xcrun swift-format lint --strict --configuration .swift-format $FILES

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REUSE
        uses: fsfe/reuse-action@v5

  test:
    # The package targets OS 27, so its test bundles only load on macOS 27. `xcode-27` is GitHub's hosted macOS 27 image with
    # Xcode 27 (public preview, https://github.com/actions/runner-images/issues/14404); `macos-26` cannot run them.
    # Switch to `macos-27` once that label exists.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: Packages/PhotosKit
        run: |
          set -o pipefail
          OS=$(sw_vers -productVersion)
          if [ "${OS%%.*}" -lt 27 ]; then
            echo "::error::Unit tests need macOS 27 (the package's deployment target); this runner has macOS $OS."
            exit 1
          fi
          xcodebuild test -scheme PhotosKit-Package -destination 'platform=macOS' -skipPackagePluginValidation \
            | tee "$RUNNER_TEMP/unit-tests.log"
      - name: Test summary
        # A green job must mean that tests ran: count them and fail when there were none.
        if: always()
        run: |
          LOG="$RUNNER_TEMP/unit-tests.log"
          TOTAL=0
          if [ -f "$LOG" ]; then
            TOTAL=$(grep -Eo 'Test run with [0-9]+ tests?' "$LOG" | awk '{ sum += $4 } END { print sum + 0 }')
          fi
          {
            echo "### Unit tests"
            echo "macOS $(sw_vers -productVersion), $(xcodebuild -version | head -1): Swift Testing ran **$TOTAL** tests."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No unit test ran."
            exit 1
          fi

  build:
    # Same image as the tests: the app targets OS 27 and uses API from the 27 SDKs (e.g. `PHAssetResource.dataSize`).
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        destination: ["generic/platform=iOS Simulator", "platform=macOS", "generic/platform=visionOS Simulator"]
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          xcodebuild -project NextcloudPhotos.xcodeproj -scheme NextcloudPhotos -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=- build
