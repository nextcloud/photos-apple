version: 2
updates:
  # Swift packages of Packages/PhotosKit (GRDB).
  - package-ecosystem: "swift"
    directory: "/Packages/PhotosKit"
    schedule:
      interval: "weekly"
    groups:
      swift-packages:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
